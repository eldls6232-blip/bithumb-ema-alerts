name: KOSPI KOSDAQ EMA score 80 alerts

on:
  schedule:
    - cron: '50 23 * * 0-4'

  workflow_dispatch:
    inputs:
      test:
        description: 'Telegram test only'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: krx-stock-ema-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scan KOSPI and KOSDAQ
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          TEST_MODE: ${{ inputs.test || 'false' }}
        run: python stock_scanner.py

      - name: Save alert history
        if: success()
        run: |
          if [ -f stock_alert_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add stock_alert_state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update KRX alert date'
              git push
            fi
          fi
